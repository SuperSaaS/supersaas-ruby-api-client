name: Lint
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  rubocop:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        # The locked minitest and the rubocop executable do not support Ruby 4 yet
        ruby-version: '3.4'
        bundler-cache: true
    - run: bundle exec rake lint
