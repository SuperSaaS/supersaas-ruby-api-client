name: SuperSaaS Ruby API Client CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is 26.04 now, and setup-ruby has no Ruby 3.0/3.1 builds for it
        os: [ubuntu-24.04, macos-latest]
        ruby: ['3.0', '3.1', '3.2', '3.3', 'head', 'jruby', 'jruby-head']
    runs-on: ${{ matrix.os }}
    env:
      # Keeps Bundler from switching back to the BUNDLED WITH version on ruby-head
      BUNDLE_VERSION: ${{ matrix.ruby == 'head' && 'system' || '' }}
    steps:
    - uses: actions/checkout@v2
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        # Bundler 2.5 (BUNDLED WITH) crashes on ruby-head, and newer Bundlers drop Ruby 3.0/3.1
        bundler: ${{ matrix.ruby == 'head' && 'latest' || 'Gemfile.lock' }}
        bundler-cache: true
    - run: bundle exec rake
